<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGV项目月报自动填写工具</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }
        body {
            background: #f5f7fa;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            padding: 25px 30px;
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            color: #1e293b;
            border-left: 5px solid #3b82f6;
            padding-left: 15px;
        }
        .info-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 20px 30px;
            background: #f8fafc;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            align-items: center;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-item label {
            font-weight: 600;
            color: #334155;
            white-space: nowrap;
        }
        .info-item input,
        .info-item select {
            padding: 6px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            outline: none;
            transition: 0.2s;
        }
        .info-item input:focus,
        .info-item select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .info-item input[type="text"] {
            width: 120px;
        }
        .info-item select {
            min-width: 80px;
        }
        .info-item .fixed-year {
            padding: 6px 12px;
            background: #f1f5f9;
            border-radius: 6px;
            font-weight: 600;
            color: #0f172a;
        }
        .toolbar {
            display: flex;
            gap: 12px;
            margin-left: auto;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            background: #e2e8f0;
            color: #1e293b;
        }
        .btn-success {
            background: #22c55e;
            color: white;
        }
        .btn-success:hover {
            background: #16a34a;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #94a3b8;
            color: #334155;
        }
        .btn-outline:hover {
            background: #f1f5f9;
        }
        .table-wrap {
            overflow-x: auto;
            margin-top: 10px;
            min-height: 200px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 900px;
        }
        th,
        td {
            border: 1px solid #e2e8f0;
            padding: 8px 10px;
            text-align: center;
            vertical-align: middle;
            white-space: nowrap;
        }
        th {
            background: #f1f5f9;
            font-weight: 700;
            color: #0f172a;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .date-cell {
            font-weight: 600;
            background: #fafcff;
        }
        .weekend {
            background-color: #fee2e2 !important;
        }
        .holiday {
            background-color: #fee2e2 !important;
        }
        .summary-row {
            background: #f8fafc;
            font-weight: 600;
        }
        .summary-row td {
            border-top: 2px solid #94a3b8;
            padding: 10px 8px;
        }
        .summary-label {
            text-align: right;
            padding-right: 15px;
        }
        input[type="time"],
        input[type="text"],
        textarea {
            border: none;
            background: transparent;
            width: 100%;
            text-align: center;
            font-size: 14px;
            outline: none;
            padding: 4px 0;
            font-family: inherit;
            resize: vertical;
        }
        input[type="time"]:focus,
        input[type="text"]:focus,
        textarea:focus {
            background: #fef9c3;
            border-radius: 4px;
        }
        textarea {
            text-align: left;
            padding: 2px 4px;
            min-height: 32px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .ro-cell {
            font-weight: 500;
            color: #1e293b;
        }
        .hint {
            font-size: 13px;
            color: #64748b;
            margin-top: 8px;
            border-top: 1px dashed #d1d5db;
            padding-top: 12px;
        }
        .hint span {
            display: inline-block;
            margin-right: 20px;
        }
        .placeholder-msg {
            text-align: center;
            padding: 40px 0;
            color: #94a3b8;
            font-size: 16px;
        }
        .project-summary {
            margin-top: 20px;
        }
        .project-summary table {
            min-width: 300px;
            width: auto;
            margin-top: 5px;
        }
        .project-summary table th,
        .project-summary table td {
            padding: 6px 20px;
        }
        .project-summary table th {
            background: #e9edf4;
        }
        @media (max-width: 700px) {
            .container {
                padding: 15px;
            }
            .info-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar {
                margin-left: 0;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="reportTitle">2026年AGV项目工作月报</h1>

        <div class="info-bar">
            <div class="info-item">
                <label>姓名</label>
                <input type="text" id="staffName" value="" placeholder="请输入姓名" style="width:120px;">
            </div>
            <div class="info-item">
                <label>工程师等级</label>
                <select id="staffLevel" style="width:150px;">
                    <option value="">请选择</option>
                    <option value="实习工程师">实习工程师</option>
                    <option value="新进工程师">新进工程师</option>
                    <option value="初级工程师">初级工程师</option>
                    <option value="中级工程师">中级工程师</option>
                    <option value="高级工程师">高级工程师</option>
                </select>
            </div>
            <div class="info-item">
                <label>年份</label>
                <select id="yearSel"></select>
            </div>
            <div class="info-item">
                <label>月份</label>
                <select id="monthSelect">
                    <option value="">请选择月份</option>
                </select>
            </div>
            <div class="toolbar">
                <button class="btn btn-success" onclick="exportCSV()">📄 导出 CSV</button>
                <button class="btn btn-outline" onclick="exportExcelHTML()">📥 导出 Excel (HTML)</button>
            </div>
        </div>

        <div class="table-wrap" id="tableWrap">
            <table id="reportTable">
                <thead>
                    <tr>
                        <th style="min-width:80px;">日期</th>
                        <th style="min-width:120px;">上班地点</th>
                        <th style="min-width:140px;">工作内容</th>
                        <th style="min-width:70px;">上班时间</th>
                        <th style="min-width:70px;">下班时间</th>
                        <th style="min-width:70px;">工作时长(h)</th>
                        <th style="min-width:70px;">加班时长(h)</th>
                        <th style="min-width:70px;">项目出勤</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
                <tfoot id="tableFoot"></tfoot>
            </table>
            <div id="placeholderMsg" class="placeholder-msg" style="display:none;">请先选择月份</div>
        </div>

        <!-- 项目地点汇总 -->
        <div class="project-summary" id="projectSummary" style="display:none;">
            <div style="font-weight:600; font-size:15px; margin-bottom:4px;">项目地点汇总</div>
            <table id="projectSummaryTable">
                <thead>
                    <tr>
                        <th>项目地点</th>
                        <th>出勤天数(天)</th>
                        <th>加班时长(h)</th>
                    </tr>
                </thead>
                <tbody id="projectSummaryBody"></tbody>
            </table>
        </div>

        <!-- 底部注释 -->
        <div class="hint">
            <span>1. 未出外勤，上班地点请填写“公司”</span>
            <span>2. 半天公司半天外勤，填写“公司/项目名”</span>
            <span>3. 工作日调休，单独“调休”不计出勤；混合“调休/项目名”则调休占4小时，上班超4小时计加班</span>
        </div>
    </div>

    <script>
        // ======================== 配置 ========================
        const HOLIDAY_API = 'https://timor.tech/api/holiday/year/';
        let holidayData = { holidays: [], workdays: [] };
        let FIXED_YEAR = new Date().getFullYear();

        async function loadHolidayData(year) {
            const cacheKey = 'holiday_cache_' + year;
            const cache = localStorage.getItem(cacheKey);
            if (cache) holidayData = JSON.parse(cache);
            try {
                const res = await fetch(HOLIDAY_API + year);
                const data = await res.json();
                const holidays = [];
                const workdays = [];
                Object.values(data.holiday || {}).forEach(item => {
                    if (item.holiday) holidays.push(item.date);
                    else workdays.push(item.date);
                });
                holidayData = { holidays, workdays };
                localStorage.setItem(cacheKey, JSON.stringify(holidayData));
            } catch(e) {
                console.log('节假日更新失败，使用缓存数据');
            }
        }

        const STD_HOURS = 8;
        const HALF_HOURS = 4;

        function isHoliday(dateStr) { return holidayData.holidays.includes(dateStr); }
        function isMakeup(dateStr) { return holidayData.workdays.includes(dateStr); }
        function isWeekend(dateStr) { const d = new Date(dateStr); const day = d.getDay(); return day === 0 || day === 6; }
        function getDaysInMonth(year, month) { return new Date(year, month, 0).getDate(); }
        function formatDate(year, month, day) { const m = String(month).padStart(2, '0'); const d = String(day).padStart(2, '0'); return `${year}-${m}-${d}`; }
        function parseTime(str) { if (!str) return null; const parts = str.split(':'); if (parts.length !== 2) return null; const h = parseInt(parts[0], 10); const m = parseInt(parts[1], 10); if (isNaN(h) || isNaN(m)) return null; return h + m / 60; }
        function timeDiff(start, end) { if (!start || !end) return 0; const s = parseTime(start); const e = parseTime(end); if (s === null || e === null) return 0; let diff = e - s; if (diff < 0) diff += 24; return Math.round(diff * 100) / 100; }

        // FIXED_YEAR 已在节假日模块中动态定义
        let currentData = [];

        // ---------- 辅助函数 ----------
        function isPureRest(place) {
            return place === '调休' || place === '休息';
        }

        // 提取项目名：过滤掉 "公司"、"调休"、"休息"
        function extractProjectName(place) {
            if (!place) return null;
            if (isPureRest(place)) return null;
            const parts = place.split('/').map(s => s.trim()).filter(s => s !== '');
            const filtered = parts.filter(p => p !== '公司' && p !== '调休' && p !== '休息');
            return filtered.length > 0 ? filtered[0] : null;
        }

        // 判断是否为混合调休/休息（含斜杠且含调休或休息，但不是纯调休）
        function isMixedRest(place) {
            if (!place) return false;
            if (isPureRest(place)) return false;
            return (place.includes('调休') || place.includes('休息')) && place.includes('/');
        }

        function generateReport() {
            const monthSel = document.getElementById('monthSelect');
            const month = parseInt(monthSel.value);
            const tbody = document.getElementById('tableBody');
            const tfoot = document.getElementById('tableFoot');
            const placeholder = document.getElementById('placeholderMsg');

            if (!monthSel.value || isNaN(month)) {
                tbody.innerHTML = '';
                tfoot.innerHTML = '';
                placeholder.style.display = 'block';
                document.getElementById('reportTable').style.display = 'none';
                document.getElementById('projectSummary').style.display = 'none';
                return;
            }
            placeholder.style.display = 'none';
            document.getElementById('reportTable').style.display = '';

            document.getElementById('reportTitle').textContent = `${FIXED_YEAR}年AGV项目工作月报`;
            const days = getDaysInMonth(FIXED_YEAR, month);
            tbody.innerHTML = '';
            currentData = [];

            for (let d = 1; d <= days; d++) {
                const dateStr = formatDate(FIXED_YEAR, month, d);
                const isH = isHoliday(dateStr);
                const isM = isMakeup(dateStr);
                const isW = isWeekend(dateStr);
                const isRest = isH && !isM;
                const isWeekendNonHoliday = isW && !isH && !isM;

                const row = document.createElement('tr');
                if (isRest || isWeekendNonHoliday) row.classList.add('holiday');

                const tdDate = document.createElement('td');
                tdDate.textContent = `${month}月${d}日`;
                tdDate.classList.add('date-cell');
                row.appendChild(tdDate);

                const tdPlace = document.createElement('td');
                const inputPlace = document.createElement('input');
                inputPlace.type = 'text';
                inputPlace.dataset.row = d;
                inputPlace.dataset.field = 'place';
                inputPlace.placeholder = '';
                tdPlace.appendChild(inputPlace);
                row.appendChild(tdPlace);

                const tdContent = document.createElement('td');
                const textareaContent = document.createElement('textarea');
                textareaContent.dataset.row = d;
                textareaContent.dataset.field = 'content';
                textareaContent.placeholder = '';
                textareaContent.rows = 1;
                tdContent.appendChild(textareaContent);
                row.appendChild(tdContent);

                const tdStart = document.createElement('td');
                const inputStart = document.createElement('input');
                inputStart.type = 'time';
                inputStart.dataset.row = d;
                inputStart.dataset.field = 'start';
                inputStart.addEventListener('focus', function() {
                    if (this.value === '') {
                        this.value = '09:00';
                        this.dispatchEvent(new Event('input'));
                    }
                });
                tdStart.appendChild(inputStart);
                row.appendChild(tdStart);

                const tdEnd = document.createElement('td');
                const inputEnd = document.createElement('input');
                inputEnd.type = 'time';
                inputEnd.dataset.row = d;
                inputEnd.dataset.field = 'end';
                inputEnd.addEventListener('focus', function() {
                    if (this.value === '') {
                        this.value = '17:00';
                        this.dispatchEvent(new Event('input'));
                    }
                });
                tdEnd.appendChild(inputEnd);
                row.appendChild(tdEnd);

                const tdDuration = document.createElement('td');
                tdDuration.textContent = '0';
                tdDuration.classList.add('ro-cell');
                tdDuration.dataset.row = d;
                tdDuration.dataset.field = 'duration';
                row.appendChild(tdDuration);

                const tdOvertime = document.createElement('td');
                tdOvertime.textContent = '0';
                tdOvertime.classList.add('ro-cell');
                tdOvertime.dataset.row = d;
                tdOvertime.dataset.field = 'overtime';
                row.appendChild(tdOvertime);

                const tdProject = document.createElement('td');
                tdProject.textContent = '0';
                tdProject.classList.add('ro-cell');
                tdProject.dataset.row = d;
                tdProject.dataset.field = 'project';
                row.appendChild(tdProject);

                tbody.appendChild(row);
                currentData.push({
                    date: dateStr, day: d, place: '', content: '',
                    start: '', end: '', duration: 0, overtime: 0, project: 0
                });
            }

            const allInputs = tbody.querySelectorAll('input, textarea');
            allInputs.forEach(el => {
                el.addEventListener('input', function(e) {
                    const rowIdx = parseInt(this.dataset.row) - 1;
                    if (isNaN(rowIdx)) return;
                    const field = this.dataset.field;
                    if (field === 'start' || field === 'end' || field === 'place' || field === 'content') {
                        updateRow(rowIdx);
                    }
                });
                el.addEventListener('change', function(e) {
                    const rowIdx = parseInt(this.dataset.row) - 1;
                    if (isNaN(rowIdx)) return;
                    updateRow(rowIdx);
                });
            });

            updateFooter();
        }

        function updateRow(index) {
            const rows = document.getElementById('tableBody').rows;
            if (index >= rows.length) return;
            const row = rows[index];
            const inputs = row.querySelectorAll('input, textarea');
            let place = '', content = '', start = '', end = '';
            inputs.forEach(el => {
                const f = el.dataset.field;
                if (f === 'place') place = el.value.trim();
                else if (f === 'content') content = el.value;
                else if (f === 'start') start = el.value;
                else if (f === 'end') end = el.value;
            });

            let duration = timeDiff(start, end);
            duration = Math.round(duration * 100) / 100;
            const tdDuration = row.cells[5];
            tdDuration.textContent = duration.toFixed(2);

            const dateStr = currentData[index].date;
            const isMakeupDay = isMakeup(dateStr);
            const isHolidayDay = isHoliday(dateStr);
            const isWeekendDay = isWeekend(dateStr);

            // ---- 加班时长计算 ----
            let overtime = 0;
            const isWeekendOrHoliday = isHolidayDay || isWeekendDay;
            if (isWeekendOrHoliday) {
                // 周末/节假日上班加班=工作时长
                overtime = duration;
            } else if (isMakeupDay) {
                // 补班日按正常工作日
                overtime = Math.max(duration - STD_HOURS, 0);
            } else {
                // 普通工作日
                if (isMixedRest(place)) {
                    // 混合调休/休息：调休占4小时，加班= duration - 4（超过4小时部分）
                    overtime = Math.max(duration - HALF_HOURS, 0);
                } else {
                    overtime = Math.max(duration - STD_HOURS, 0);
                }
            }
            overtime = Math.round(overtime * 100) / 100;
            const tdOvertime = row.cells[6];
            tdOvertime.textContent = overtime.toFixed(2);

            // ---- 项目出勤计算 ----
            let project = 0;
            if (isPureRest(place)) {
                project = 0;
            } else {
                if (place && duration > 0) {
                    const hasCompany = place.includes('公司');
                    const hasSlash = place.includes('/');
                    if (hasCompany && hasSlash) {
                        project = 0.5;
                    } else if (hasCompany && !hasSlash) {
                        project = 0;
                    } else {
                        if (duration >= 8) project = 1;
                        else if (duration >= 4) project = 0.5;
                        else project = 0;
                    }
                }
            }
            project = Math.round(project * 100) / 100;
            const tdProject = row.cells[7];
            tdProject.textContent = project.toFixed(2);

            currentData[index].place = place;
            currentData[index].content = content;
            currentData[index].start = start;
            currentData[index].end = end;
            currentData[index].duration = duration;
            currentData[index].overtime = overtime;
            currentData[index].project = project;

            updateFooter();
        }

        // 获取项目汇总数据
        function getProjectSummary() {
            const projectMap = new Map();
            currentData.forEach(item => {
                const place = item.place;
                if (!place) return;
                if (isPureRest(place)) return;
                const projectName = extractProjectName(place);
                if (!projectName) return;
                if (!projectMap.has(projectName)) {
                    projectMap.set(projectName, { days: 0, overtime: 0 });
                }
                const entry = projectMap.get(projectName);
                entry.days += item.project;
                entry.overtime += item.overtime;
            });
            const result = [];
            projectMap.forEach((value, key) => {
                result.push({ project: key, days: value.days, overtime: value.overtime });
            });
            result.sort((a, b) => a.project.localeCompare(b.project));
            return result;
        }

        function updateFooter() {
            const tfoot = document.getElementById('tableFoot');
            tfoot.innerHTML = '';

            const month = parseInt(document.getElementById('monthSelect').value);
            if (isNaN(month)) {
                document.getElementById('projectSummary').style.display = 'none';
                return;
            }

            // ---- 月度汇总 ----
            let totalDuration = 0, totalOvertime = 0, totalProject = 0;
            let totalWorkDays = 0;
            let totalRestDays = 0;

            currentData.forEach(item => {
                const dur = item.duration;
                const place = item.place;
                totalDuration += dur;
                totalOvertime += item.overtime;
                totalProject += item.project;

                // 实际上班天数：排除纯调休/休息
                if (!isPureRest(place) && dur > 0) {
                    if (dur >= STD_HOURS) totalWorkDays += 1;
                    else if (dur >= HALF_HOURS) totalWorkDays += 0.5;
                }

                // 已调休天数
                const dateStr = item.date;
                const isH = isHoliday(dateStr);
                const isM = isMakeup(dateStr);
                const isW = isWeekend(dateStr);
                const isWorkday = isM || (!isH && !isW);
                if (isWorkday && (place.includes('调休') || place.includes('休息'))) {
                    if (place === '调休' || place === '休息') {
                        totalRestDays += 1;
                    } else {
                        totalRestDays += 0.5;
                    }
                }
            });

            const projectDays = totalProject;
            const restComp = totalOvertime / STD_HOURS;

            const tr1 = document.createElement('tr');
            tr1.classList.add('summary-row');
            const tdLabel = document.createElement('td');
            tdLabel.colSpan = 2;
            tdLabel.textContent = '月度汇总统计';
            tdLabel.style.fontWeight = '600';
            tdLabel.style.textAlign = 'right';
            tdLabel.style.paddingRight = '15px';
            tr1.appendChild(tdLabel);

            const labels = [
                '实际上班天数(天)', '项目出勤天数(天)',
                '总工作时长(h)', '总加班时长(h)',
                '当月累计可调休天数(天)', '当月已调休天数(天)'
            ];
            labels.forEach(label => {
                const td = document.createElement('td');
                td.textContent = label;
                td.style.fontWeight = '600';
                tr1.appendChild(td);
            });
            tfoot.appendChild(tr1);

            const tr2 = document.createElement('tr');
            tr2.classList.add('summary-row');
            const tdEmpty1 = document.createElement('td');
            tdEmpty1.colSpan = 2;
            tdEmpty1.textContent = '';
            tr2.appendChild(tdEmpty1);

            const values = [
                totalWorkDays.toFixed(1),
                projectDays.toFixed(2),
                totalDuration.toFixed(2),
                totalOvertime.toFixed(2),
                restComp.toFixed(2),
                totalRestDays.toFixed(1)
            ];
            values.forEach(val => {
                const td = document.createElement('td');
                td.textContent = val;
                td.style.fontWeight = '700';
                td.style.color = '#0f172a';
                tr2.appendChild(td);
            });
            tfoot.appendChild(tr2);

            // ---- 项目地点汇总 ----
            const projectSummary = getProjectSummary();
            const projectDiv = document.getElementById('projectSummary');
            const projectBody = document.getElementById('projectSummaryBody');
            if (projectSummary.length === 0) {
                projectDiv.style.display = 'none';
            } else {
                projectDiv.style.display = 'block';
                projectBody.innerHTML = '';
                projectSummary.forEach(item => {
                    const tr = document.createElement('tr');
                    const td1 = document.createElement('td');
                    td1.textContent = item.project;
                    const td2 = document.createElement('td');
                    td2.textContent = item.days.toFixed(1);
                    const td3 = document.createElement('td');
                    td3.textContent = item.overtime.toFixed(2);
                    tr.appendChild(td1);
                    tr.appendChild(td2);
                    tr.appendChild(td3);
                    projectBody.appendChild(tr);
                });
            }
        }

        // ======================== 导出功能 ========================

        function buildFileName(month, ext) {
            const name = document.getElementById('staffName').value.trim();
            const namePart = name ? name + '_' : '';
            return `AGV月报_${namePart}${FIXED_YEAR}_${month}.${ext}`;
        }

        // 导出 HTML 格式的 Excel (.xls)
        function exportExcelHTML() {
            const month = document.getElementById('monthSelect').value;
            if (!month) { alert('请先选择月份！'); return; }
            const name = document.getElementById('staffName').value;
            const level = document.getElementById('staffLevel').value;
            const title = document.getElementById('reportTitle').textContent;

            const table = document.getElementById('reportTable');
            const clone = table.cloneNode(true);
            const inputs = clone.querySelectorAll('input');
            inputs.forEach(inp => { const td = inp.parentNode; td.textContent = inp.value || ''; });
            const textareas = clone.querySelectorAll('textarea');
            textareas.forEach(ta => { const td = ta.parentNode; td.textContent = ta.value || ''; });

            const projectSummary = getProjectSummary();
            let projectHTML = '';
            if (projectSummary.length > 0) {
                projectHTML = `<br><br><table border="1" cellpadding="4" style="border-collapse:collapse;">
                    <tr style="background:#e9edf4;font-weight:bold;">
                        <td>项目地点</td><td>出勤天数(天)</td><td>加班时长(h)</td>
                    </tr>`;
                projectSummary.forEach(item => {
                    projectHTML += `<tr><td>${item.project}</td><td>${item.days.toFixed(1)}</td><td>${item.overtime.toFixed(2)}</td></tr>`;
                });
                projectHTML += `</table>`;
            }

            const style = `
                <style>
                    th { background: #e9edf4; font-weight: bold; }
                    td { border: 1px solid #ccc; padding: 6px; }
                    .holiday { background: #fee2e2; }
                    .weekend { background: #fee2e2; }
                    .summary-row { background: #f8fafc; font-weight: 600; }
                    .date-cell { font-weight: 600; }
                </style>
            `;
            const html = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office"
                      xmlns:x="urn:schemas-microsoft-com:office:excel"
                      xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="UTF-8"><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
                    <!--[if gte mso 9]>
                    <xml>
                        <x:ExcelWorkbook>
                            <x:ExcelWorksheets>
                                <x:ExcelWorksheet>
                                    <x:Name>AGV月报</x:Name>
                                    <x:WorksheetOptions>
                                        <x:DisplayGridlines/>
                                    </x:WorksheetOptions>
                                </x:ExcelWorksheet>
                            </x:ExcelWorksheets>
                        </x:ExcelWorkbook>
                    </xml>
                    <![endif]-->
                    ${style}
                </head>
                <body>
                    <h2>${title}</h2>
                    <p>姓名：${name || ''} ｜ 等级：${level || ''} ｜ 年份：${FIXED_YEAR} ｜ 月份：${month}</p>
                    ${clone.outerHTML}
                    ${projectHTML}
                </body>
                </html>
            `;

            const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = buildFileName(month, 'xls');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 导出 CSV
        function exportCSV() {
            const month = document.getElementById('monthSelect').value;
            if (!month) { alert('请先选择月份！'); return; }
            const name = document.getElementById('staffName').value;
            const level = document.getElementById('staffLevel').value;

            let csv = '\uFEFF';
            csv += `"${FIXED_YEAR}年AGV项目工作月报"\n`;
            csv += `"姓名","${name || ''}","工程师等级","${level || ''}","填报年份",${FIXED_YEAR},"填报月份",${month}\n`;
            csv += `"日期","上班地点","工作内容","上班时间","下班时间","工作时长(h)","加班时长(h)","项目出勤"\n`;

            currentData.forEach(item => {
                csv +=
                    `"${item.date}","${item.place}","${(item.content || '').replace(/"/g, '""')}","${item.start}","${item.end}",${item.duration.toFixed(2)},${item.overtime.toFixed(2)},${item.project.toFixed(2)}\n`;
            });

            // 月度汇总行
            let totalDuration = 0, totalOvertime = 0, totalProject = 0;
            let totalWorkDays = 0, totalRestDays = 0;
            currentData.forEach(item => {
                const dur = item.duration;
                const place = item.place;
                totalDuration += dur;
                totalOvertime += item.overtime;
                totalProject += item.project;
                if (!isPureRest(place) && dur > 0) {
                    if (dur >= STD_HOURS) totalWorkDays += 1;
                    else if (dur >= HALF_HOURS) totalWorkDays += 0.5;
                }
                const dateStr = item.date;
                const isH = isHoliday(dateStr);
                const isM = isMakeup(dateStr);
                const isW = isWeekend(dateStr);
                const isWorkday = isM || (!isH && !isW);
                if (isWorkday && (place.includes('调休') || place.includes('休息'))) {
                    if (place === '调休' || place === '休息') totalRestDays += 1;
                    else totalRestDays += 0.5;
                }
            });
            const projectDays = totalProject;
            const restComp = totalOvertime / STD_HOURS;

            csv += `\n`;
            csv +=
                `"月度汇总统计",,"实际上班天数(天)","项目出勤天数(天)","总工作时长(h)","总加班时长(h)","当月累计可调休天数(天)","当月已调休天数(天)"\n`;
            csv +=
                `,,${totalWorkDays.toFixed(1)},${projectDays.toFixed(2)},${totalDuration.toFixed(2)},${totalOvertime.toFixed(2)},${restComp.toFixed(2)},${totalRestDays.toFixed(1)}\n`;

            const projectSummary = getProjectSummary();
            if (projectSummary.length > 0) {
                csv += `\n"项目地点汇总",,,,,\n`;
                csv += `"项目地点","出勤天数(天)","加班时长(h)",,,,\n`;
                projectSummary.forEach(item => {
                    csv += `"${item.project}",${item.days.toFixed(1)},${item.overtime.toFixed(2)},,,,\n`;
                });
            }

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = buildFileName(month, 'csv');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ========== 初始化 ==========
        async function init() {
            const yearSel = document.getElementById('yearSel');
            const now = new Date().getFullYear();
            for (let y = now; y <= now + 10; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.text = y;
                yearSel.appendChild(opt);
            }
            yearSel.value = now;

            const monthSel = document.getElementById('monthSelect');
            for (let m = 1; m <= 12; m++) {
                const opt = document.createElement('option');
                opt.value = m;
                opt.text = m;
                monthSel.appendChild(opt);
            }
            yearSel.addEventListener('change', async function(){
                FIXED_YEAR = Number(this.value);
                await loadHolidayData(FIXED_YEAR);
                generateReport();
            });
            monthSel.addEventListener('change', generateReport);
            await loadHolidayData(FIXED_YEAR);
            generateReport();
        }
        window.onload = init;
    </script>
</body>
</html>
